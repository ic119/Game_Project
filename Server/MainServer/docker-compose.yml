services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-game_auth}
      MYSQL_USER: ${MYSQL_USER:-game_server}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD를 .env에 설정하세요}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD를 .env에 설정하세요}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend

  mainserver:
    build:
      context: .
      dockerfile: MainServer/Dockerfile
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-game_auth};User=${MYSQL_USER:-game_server};Password=${MYSQL_PASSWORD};"
      Jwt__Key: ${JWT_KEY:?JWT_KEY를 .env에 설정하세요}
      Jwt__Issuer: GameAuthServer
    ports:
      - "8080:8080"
    networks:
      - backend

  gameserver:
    build:
      context: .
      dockerfile: GameServer/Dockerfile
    restart: unless-stopped
    depends_on:
      - mainserver
    environment:
      # Game_EnterRequest의 AccessToken이 실제로 그 캐릭터의 소유 계정인지 MainServer(AuthServer)에
      # 위임해 확인할 때 쓰는 주소(PlayerAuthValidator). 컨테이너 네트워크 안에서는 localhost가 아니라
      # 서비스명(mainserver)으로 접근해야 하고, mainserver는 컨테이너 내부에서 HTTPS가 아닌 HTTP(8080)만 연다.
      AuthServer__BaseUrl: "http://mainserver:8080"
    ports:
      - "9000:9000"
    networks:
      - backend

networks:
  backend:

volumes:
  mysql_data:
